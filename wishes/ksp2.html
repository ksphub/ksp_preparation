
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday SU</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

body {
    background: linear-gradient(to bottom, #020617, #101b3b, #263b62);
    color: white;
}

/* Sky background */
.sky {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
}

/* Twinkling stars */
.star {
    position: absolute;
    color: white;
    font-size: 3px;
    text-shadow: 0 0 7px white;
    animation: twinkle 2s infinite alternate;
}

@keyframes twinkle {
    from { opacity: 0.3; transform: scale(0.7); }
    to { opacity: 1; transform: scale(1.5); }
}

/* Happy Birthday SU star lettering */
.star-message {
    position: absolute;
    top: 12%;
    left: 50%;
    transform: translateX(-50%);
    width: 95%;
    max-width: 750px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
}

.star-line {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 3px;
    flex-wrap: nowrap;
}

.star-line span {
    color: #fff3a6;
    font-size: clamp(13px, 2.5vw, 23px);
    text-shadow: 0 0 7px white, 0 0 15px gold;
    animation: letterGlow 1.5s infinite alternate;
}

@keyframes letterGlow {
    from { opacity: 0.45; }
    to { opacity: 1; }
}

/* Small shiny crescent moon - no shadow */
.moon {
    position: absolute;
    width: 58px;
    height: 58px;
    top: 42%;
    right: 13%;
    border-radius: 50%;
    background: #fff4bd;
    overflow: hidden;
    animation: moonShine 2s infinite alternate;
}

.moon::after {
    content: "";
    position: absolute;
    width: 56px;
    height: 56px;
    top: -9px;
    left: 20px;
    border-radius: 50%;
    background: #101b3b;
}

@keyframes moonShine {
    from { filter: brightness(0.85); }
    to { filter: brightness(1.3); }
}

/* Shooting stars */
.shooting-star {
    position: absolute;
    width: 90px;
    height: 2px;
    background: linear-gradient(90deg, white, transparent);
    transform: rotate(-35deg);
    animation: shooting 3s linear forwards;
}

@keyframes shooting {
    from {
        transform: translate(0, 0) rotate(-35deg);
        opacity: 1;
    }
    to {
        transform: translate(-400px, 300px) rotate(-35deg);
        opacity: 0;
    }
}

/* Fireworks */
#fireworks {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

/* Rising sky lanterns */
.lantern {
    position: fixed;
    bottom: -50px;
    width: 17px;
    height: 25px;
    background: linear-gradient(to bottom, #fff5b5, #ff9b42);
    border-radius: 45% 45% 35% 35%;
    box-shadow: 0 0 12px #ffc45e, 0 0 25px #ff9b42;
    animation: lanternRise linear infinite;
    pointer-events: none;
}

.lantern::after {
    content: "";
    position: absolute;
    bottom: -3px;
    left: 5px;
    width: 7px;
    height: 4px;
    background: #ffe5a0;
}

@keyframes lanternRise {
    0% {
        transform: translateY(0) translateX(0);
        opacity: 0;
    }
    15% { opacity: 1; }
    50% { transform: translateY(-50vh) translateX(25px); }
    100% {
        transform: translateY(-115vh) translateX(-25px);
        opacity: 0;
    }
}

/* Birthday message */
.content {
    position: absolute;
    top: 57%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 90%;
    max-width: 650px;
    text-align: center;
    z-index: 5;
}

.content h1 {
    color: #ffe7a0;
    font-size: clamp(27px, 5vw, 48px);
    text-shadow: 0 0 15px orange, 0 0 30px gold;
    animation: titleGlow 2s infinite alternate;
}

.content p {
    margin-top: 20px;
    font-size: clamp(15px, 2.5vw, 21px);
    line-height: 1.7;
    color: #fff4df;
    text-shadow: 0 0 8px #a9baff;
}

@keyframes titleGlow {
    from { opacity: 0.8; }
    to { opacity: 1; }
}

button {
    margin-top: 22px;
    padding: 12px 25px;
    border: none;
    border-radius: 30px;
    background: linear-gradient(45deg, #ffcc70, #ff758c);
    color: #171126;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 15px #ffb347;
}

@media (max-width: 500px) {
    .star-message {
        top: 14%;
        gap: 8px;
    }

    .star-line {
        gap: 1px;
    }

    .star-line span {
        font-size: clamp(9px, 2.4vw, 14px);
    }

    .moon {
        width: 42px;
        height: 42px;
        top: 39%;
        right: 10%;
    }

    .moon::after {
        width: 42px;
        height: 42px;
        top: -7px;
        left: 15px;
    }

    .content {
        top: 61%;
    }
}
</style>
</head>

<body>

<div class="sky" id="sky">

    <div class="moon"></div>

    <!-- Birthday message made with stars -->
    <div class="star-message" id="starMessage"></div>

</div>

<canvas id="fireworks"></canvas>

<!-- Main birthday wishes -->
<div class="content">
    <h1>🎂 Happy Birthday SU 🎂</h1>

    <p>
        May your life shine as brightly as the stars
        and sparkle like the beautiful moon.
        <br>
        May every dream come true and every moment
        bring happiness, love and success.
        <br><br>
        ❤️ Wishing you a wonderful birthday! ❤️
    </p>

    <button onclick="celebrate()">
        🎆 Celebrate Birthday 🎆
    </button>
</div>

<script>
// Create background stars
const sky = document.getElementById("sky");

for (let i = 0; i < 130; i++) {
    const star = document.createElement("span");
    star.className = "star";
    star.textContent = "✦";
    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 100 + "%";
    star.style.animationDelay = Math.random() * 3 + "s";
    star.style.fontSize = (2 + Math.random() * 5) + "px";
    sky.appendChild(star);
}

// Draw HAPPY BIRTHDAY SU using stars
const message = document.getElementById("starMessage");

const words = [
    "HAPPY",
    "BIRTHDAY",
    "SU"
];

words.forEach((word, row) => {
    const line = document.createElement("div");
    line.className = "star-line";

    for (const letter of word) {
        const star = document.createElement("span");
        star.textContent = "★";
        star.title = letter;
        line.appendChild(star);
    }

    message.appendChild(line);
});

// Rising sky lanterns
for (let i = 0; i < 24; i++) {
    const lantern = document.createElement("div");
    lantern.className = "lantern";
    lantern.style.left = Math.random() * 100 + "%";
    lantern.style.animationDuration = (12 + Math.random() * 12) + "s";
    lantern.style.animationDelay = (Math.random() * 20) + "s";
    document.body.appendChild(lantern);
}

// Shooting stars
function createShootingStar() {
    const shooting = document.createElement("div");
    shooting.className = "shooting-star";
    shooting.style.left = (40 + Math.random() * 60) + "%";
    shooting.style.top = (Math.random() * 45) + "%";
    sky.appendChild(shooting);

    setTimeout(() => shooting.remove(), 3000);
}

setInterval(createShootingStar, 2500);

// Fireworks canvas
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

resizeCanvas();
window.addEventListener("resize", resizeCanvas);

let particles = [];

function explode(x, y) {
    const colors = [
        "#ff3b3b", "#ffd700", "#00e5ff",
        "#ff69b4", "#7cff6b", "#ffffff",
        "#b388ff", "#ff9f43"
    ];

    const color = colors[Math.floor(Math.random() * colors.length)];

    for (let i = 0; i < 90; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5 + 1;

        particles.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 100,
            color: color,
            size: Math.random() * 3 + 1
        });
    }
}

function animateFireworks() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    particles.forEach((p, index) => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.025;
        p.vx *= 0.99;
        p.vy *= 0.99;
        p.life--;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.life / 100);
        ctx.shadowBlur = 12;
        ctx.shadowColor = p.color;
        ctx.fill();

        if (p.life <= 0) {
            particles.splice(index, 1);
        }
    });

    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;

    requestAnimationFrame(animateFireworks);
}

animateFireworks();

// Automatic fireworks
setInterval(() => {
    explode(
        Math.random() * canvas.width,
        Math.random() * canvas.height * 0.55
    );
}, 1200);

// Birthday celebration button
function celebrate() {
    for (let i = 0; i < 10; i++) {
        setTimeout(() => {
            explode(
                Math.random() * canvas.width,
                Math.random() * canvas.height * 0.65
            );
        }, i * 200);
    }
}

// Initial celebration
setTimeout(celebrate, 1000);

</script>

</body>
</html>
