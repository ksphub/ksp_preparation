
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday!</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: radial-gradient(circle, #172554, #020617 75%);
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    overflow: hidden;
}

#fireworks {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
}

.birthday {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
}

h1 {
    font-size: clamp(2.5rem, 9vw, 5.5rem);
    color: #ffd700;
    text-shadow: 0 0 15px #ff4500,
                 0 0 35px #ff1493;
    animation: glow 1.5s infinite alternate;
}

h2 {
    font-size: clamp(1.5rem, 5vw, 3rem);
    color: #ff69b4;
    margin: 15px;
}

p {
    font-size: clamp(1rem, 3vw, 1.4rem);
    line-height: 1.8;
    max-width: 650px;
}

button {
    margin-top: 25px;
    padding: 14px 25px;
    border: none;
    border-radius: 30px;
    background: linear-gradient(45deg, #ff1493, #ff8c00);
    color: white;
    font-size: 1rem;
    cursor: pointer;
    box-shadow: 0 0 20px #ff1493;
}

@keyframes glow {
    from { transform: scale(1); }
    to { transform: scale(1.06); }
}

.emoji {
    font-size: 3rem;
    margin-bottom: 15px;
    animation: bounce 1s infinite alternate;
}

@keyframes bounce {
    to { transform: translateY(-12px); }
}
</style>
</head>

<body>

<canvas id="fireworks"></canvas>

<div class="birthday">
    <div class="emoji">🎂 🎉 🎁</div>

    <h1>Happy Birthday!</h1>

    <!-- Change the name below -->
    <h2>Dear Birthday Star ❤️</h2>

    <p>
        May your special day be filled with happiness,
        good health, success and endless love.
        May all your dreams come true!
    </p>

    <button onclick="launchCelebration()">
        🎆 Blast the Fireworks!
    </button>
</div>

<script>
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");

let particles = [];
let rockets = [];

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

resizeCanvas();
window.addEventListener("resize", resizeCanvas);

function launchRocket() {
    rockets.push({
        x: Math.random() * canvas.width,
        y: canvas.height,
        targetY: Math.random() * canvas.height * 0.55,
        speed: 5 + Math.random() * 4,
        color: `hsl(${Math.random() * 360}, 100%, 60%)`
    });
}

function explode(x, y, color) {
    for (let i = 0; i < 90; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5 + 1;

        particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 80,
            color
        });
    }
}

function animate() {
    ctx.fillStyle = "rgba(2, 6, 23, 0.20)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    rockets.forEach((r, i) => {
        r.y -= r.speed;

        ctx.beginPath();
        ctx.arc(r.x, r.y, 3, 0, Math.PI * 2);
        ctx.fillStyle = r.color;
        ctx.fill();

        if (r.y <= r.targetY) {
            explode(r.x, r.y, r.color);
            rockets.splice(i, 1);
        }
    });

    particles.forEach((p, i) => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.035;
        p.life--;

        ctx.globalAlpha = Math.max(0, p.life / 80);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
        ctx.fill();

        if (p.life <= 0) particles.splice(i, 1);
    });

    ctx.globalAlpha = 1;
    requestAnimationFrame(animate);
}

function launchCelebration() {
    for (let i = 0; i < 8; i++) {
        setTimeout(launchRocket, i * 180);
    }
}

// Automatic fireworks
setInterval(launchRocket, 650);
animate();
</script>

</body>
</html>
