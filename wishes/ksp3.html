.lantern:after{
  content:"";position:absolute;left:4px;bottom:-3px;width:5px;height:3px;
  background:#f7d99a;border-radius:0 0 2px 2px
}
@keyframes rise{
  0%{transform:translate3d(0,0,0) rotate(-2deg) scale(.75);opacity:0}
  12%{opacity:.9}
  48%{transform:translate3d(24px,-48vh,0) rotate(4deg) scale(1)}
  82%{opacity:.65}
  100%{transform:translate3d(-18px,-112vh,0) rotate(-5deg) scale(.7);opacity:0}
}
/* A small optional sound-free celebration control. */
.controls{
  position:absolute;z-index:5;right:12px;bottom:12px;display:flex;gap:8px;
}
.controls button{
  border:1px solid rgba(255,225,160,.7);border-radius:24px;
  padding:8px 13px;color:#fff4d4;background:rgba(7,14,35,.48);
  font:600 12px Arial,sans-serif;backdrop-filter:blur(5px);
  box-shadow:0 0 12px rgba(255,190,80,.18);cursor:pointer
}
.controls button:active{transform:scale(.96)}
@media (min-aspect-ratio: 3/4){
  .scene{width:min(100vw, calc(100dvh * 0.6304));height:100dvh;
    box-shadow:0 0 45px rgba(0,0,0,.55)}
}
@media (prefers-reduced-motion:reduce){
  .lantern{animation-play-state:paused}
}
</style>
</head>
<body>
<main class="scene" id="scene" aria-label="Animated birthday greeting for SU">
  <canvas id="effects"></canvas>
  <div class="controls">
    <button id="burstButton" type="button">✨ More fireworks</button>
    <button id="pauseButton" type="button">Ⅱ Pause</button>
  </div>
</main>
<script>
(() => {
  const scene = document.getElementById('scene');
  const canvas = document.getElementById('effects');
  const ctx = canvas.getContext('2d');
  const burstButton = document.getElementById('burstButton');
  const pauseButton = document.getElementById('pauseButton');
  let width = 0, height = 0, dpr = 1;
  let stars = [], particles = [], paused = false, lastBurst = 0;

  function resize() {
    const r = scene.getBoundingClientRect();
    width = r.width; height = r.height;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    stars = Array.from({length: Math.max(65, Math.round(width * height / 3300))}, () => ({
      x: Math.random() * width,
      y: Math.random() * height * .77,
      radius: .35 + Math.random() * 1.35,
      phase: Math.random() * Math.PI * 2,
      speed: .5 + Math.random() * 1.8,
      gold: Math.random() > .55
    }));
  }
  window.addEventListener('resize', resize);
  resize();

  // Lanterns are deliberately subtle so the chosen lettering stays readable.
  function addLanterns() {
    for (let i = 0; i < 13; i++) {
      const el = document.createElement('i');
      el.className = 'lantern';
      el.style.left = (4 + Math.random() * 92) + '%';
      el.style.setProperty('--duration', (17 + Math.random() * 16) + 's');
      el.style.setProperty('--delay', (-Math.random() * 28) + 's');
      el.style.opacity = .8;
      scene.appendChild(el);
    }
  }
  addLanterns();

  function burst(x, y, strength = 1) {
    const palette = ['#ffe18a', '#fff8d9', '#ff9ec7', '#8beaff', '#d5b2ff', '#ffad62'];
    const color = palette[Math.floor(Math.random() * palette.length)];
    const count = Math.round(58 * strength);
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = (1 + Math.random() * 3.4) * strength;
      particles.push({
        x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
        life: 55 + Math.random() * 35, maxLife: 90,
        size: .7 + Math.random() * 1.7, color
      });
    }
  }

  function celebrate() {
    // Keep bursts mostly around the upper sky and outer edges of the greeting.
    burst(width * (.13 + Math.random() * .17), height * (.09 + Math.random() * .24), 1.05);
    burst(width * (.72 + Math.random() * .17), height * (.10 + Math.random() * .25), 1.0);
  }
  burstButton.addEventListener('click', () => {
    for (let i = 0; i < 5; i++) {
      setTimeout(() => burst(width * (.12 + Math.random() * .76),
        height * (.08 + Math.random() * .38), 1.15), i * 180);
    }
  });

  pauseButton.addEventListener('click', () => {
    paused = !paused;
    pauseButton.textContent = paused ? '▶ Resume' : 'Ⅱ Pause';
    scene.querySelectorAll('.lantern').forEach(el => {
      el.style.animationPlayState = paused ? 'paused' : 'running';
    });
    if (!paused) requestAnimationFrame(draw);
  });

  let animationId = 0;
  function draw(time) {
    if (paused) return;
    ctx.clearRect(0, 0, width, height);

    // Twinkling stars drift in brightness over the entire night sky.
    for (const s of stars) {
      const alpha = .18 + .72 * (.5 + .5 * Math.sin(time * .001 * s.speed + s.phase));
      ctx.globalAlpha = alpha;
      ctx.fillStyle = s.gold ? '#ffdf8a' : '#eaf5ff';
      ctx.shadowBlur = s.radius > 1 ? 8 : 3;
      ctx.shadowColor = ctx.fillStyle;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
      ctx.fill();
    }

    // Fine, fading firework trails.
    ctx.globalCompositeOperation = 'lighter';
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy;
      p.vy += .018; p.vx *= .991; p.vy *= .991; p.life--;
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = p.color; ctx.shadowBlur = 8; ctx.shadowColor = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
      if (p.life <= 0) particles.splice(i, 1);
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;

    if (time - lastBurst > 2450) {
      // Occasional paired fireworks echo the two fireworks in the artwork.
      celebrate(); lastBurst = time;
    }
    animationId = requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
