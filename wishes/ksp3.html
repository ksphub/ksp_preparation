
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday SU</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

body {
    background: linear-gradient(to bottom, #020617, #101b3b, #263b62);
    color: white;
}

/* SKY */
.sky {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
}

/* BACKGROUND STARS */
.star {
    position: absolute;
    color: white;
    font-size: 3px;
    text-shadow: 0 0 7px white;
    animation: twinkle 2s infinite alternate;
}

@keyframes twinkle {
    from { opacity: 0.3; transform: scale(0.7); }
    to { opacity: 1; transform: scale(1.5); }
}

/* STAR LETTER MESSAGE */
.star-message {
    position: absolute;
    top: 9%;
    left: 50%;
    transform: translateX(-50%);
    width: 98%;
    max-width: 850px;
    height: 155px;
}

#starText {
    width: 100%;
    height: 100%;
    display: block;
}

/* STYLISH CRESCENT MOON */
.moon-container {
    position: absolute;
    top: 29%;
    left: 50%;
    transform: translateX(-50%);
    width: 100px;
    height: 100px;
    animation: moonFloat 4s ease-in-out infinite;
}

.moon {
    position: absolute;
    width: 65px;
    height: 65px;
    top: 10px;
    left: 18px;
    border-radius: 50%;
    background: linear-gradient(135deg, #fffde7, #ffe58a, #ffbd45);
    overflow: hidden;
    box-shadow:
        0 0 12px #fff5bd,
        0 0 25px #ffdf70,
        0 0 45px rgba(255, 196, 72, 0.5);
}

.moon::after {
    content: "";
    position: absolute;
    width: 63px;
    height: 63px;
    top: -13px;
    left: 23px;
    border-radius: 50%;
    background: #101b3b;
}

.moon-shine {
    position: absolute;
    top: 7px;
    left: 30px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: white;
    box-shadow: 0 0 12px 5px #fff5bd;
    z-index: 2;
}

.moon-star {
    position: absolute;
    color: #fff3a6;
    font-size: 17px;
    text-shadow: 0 0 12px gold, 0 0 20px white;
    animation: twinkle 1.5s infinite alternate;
}

.moon-star.one {
    top: 0;
    right: 2px;
}

.moon-star.two {
    bottom: 5px;
    left: 0;
    font-size: 12px;
}

.moon-star.three {
    top: 45px;
    right: -8px;
    font-size: 11px;
}

@keyframes moonFloat {
    0%, 100% { transform: translate(-50%, 0); }
    50% { transform: translate(-50%, -9px); }
}

/* SHOOTING STARS */
.shooting-star {
    position: absolute;
    width: 90px;
    height: 2px;
    background: linear-gradient(90deg, white, transparent);
    transform: rotate(-35deg);
    animation: shooting 3s linear forwards;
}

@keyframes shooting {
    from {
        transform: translate(0, 0) rotate(-35deg);
        opacity: 1;
    }
    to {
        transform: translate(-400px, 300px) rotate(-35deg);
        opacity: 0;
    }
}

/* FIREWORKS */
#fireworks {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

/* SKY LANTERNS */
.lantern {
    position: fixed;
    bottom: -50px;
    width: 17px;
    height: 25px;
    background: linear-gradient(to bottom, #fff5b5, #ff9b42);
    border-radius: 45% 45% 35% 35%;
    box-shadow: 0 0 12px #ffc45e, 0 0 25px #ff9b42;
    animation: lanternRise linear infinite;
    pointer-events: none;
}

.lantern::after {
    content: "";
    position: absolute;
    bottom: -3px;
    left: 5px;
    width: 7px;
    height: 4px;
    background: #ffe5a0;
}

@keyframes lanternRise {
    0% {
        transform: translateY(0);
        opacity: 0;
    }
    15% { opacity: 1; }
    50% { transform: translateY(-50vh) translateX(25px); }
    100% {
        transform: translateY(-115vh) translateX(-25px);
        opacity: 0;
    }
}

/* BIRTHDAY WISHES */
.content {
    position: absolute;
    top: 58%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 90%;
    max-width: 650px;
    text-align: center;
    z-index: 5;
}

.content h1 {
    color: #ffe7a0;
    font-size: clamp(27px, 5vw, 48px);
    text-shadow: 0 0 15px orange, 0 0 30px gold;
    animation: titleGlow 2s infinite alternate;
}

.content p {
    margin-top: 20px;
    font-size: clamp(15px, 2.5vw, 21px);
    line-height: 1.7;
    color: #fff4df;
    text-shadow: 0 0 8px #a9baff;
}

@keyframes titleGlow {
    from { opacity: 0.8; }
    to { opacity: 1; }
}

button {
    margin-top: 22px;
    padding: 12px 25px;
    border: none;
    border-radius: 30px;
    background: linear-gradient(45deg, #ffcc70, #ff758c);
    color: #171126;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 15px #ffb347;
}

@media (max-width: 500px) {
    .star-message {
        top: 11%;
        height: 120px;
        width: 98%;
    }

    .moon-container {
        top: 28%;
        transform: translateX(-50%) scale(0.8);
    }

    .content {
        top: 61%;
    }
}

@media (max-height: 650px) {
    .star-message {
        top: 5%;
        height: 105px;
    }

    .moon-container {
        top: 24%;
        transform: translateX(-50%) scale(0.7);
    }

    .content {
        top: 59%;
    }
}
</style>
</head>

<body>

<div class="sky" id="sky">

    <!-- STAR LETTERS -->
    <div class="star-message">
        <canvas id="starText"></canvas>
    </div>

    <!-- STYLISH CRESCENT MOON -->
    <div class="moon-container">
        <div class="moon">
            <div class="moon-shine"></div>
        </div>
        <span class="moon-star one">✦</span>
        <span class="moon-star two">✧</span>
        <span class="moon-star three">✦</span>
    </div>

</div>

<canvas id="fireworks"></canvas>

<!-- BIRTHDAY WISHES -->
<div class="content">

    <h1>🎂 Happy Birthday SU 🎂</h1>

    <p>
        May your life shine as brightly as the stars
        and sparkle like the beautiful moon.
        <br>
        May every dream come true and every moment
        bring happiness, love and success.
        <br><br>
        ❤️ Wishing you a wonderful birthday! ❤️
    </p>

    <button onclick="celebrate()">
        🎆 Celebrate Birthday 🎆
    </button>

</div>

<script>

/* BACKGROUND STARS */
const sky = document.getElementById("sky");

for (let i = 0; i < 130; i++) {
    const star = document.createElement("span");
    star.className = "star";
    star.textContent = "✦";
    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 100 + "%";
    star.style.animationDelay = Math.random() * 3 + "s";
    star.style.fontSize = (2 + Math.random() * 5) + "px";
    sky.appendChild(star);
}

/* HAPPY BIRTHDAY..... SU!!! USING STAR LETTERS */
const starCanvas = document.getElementById("starText");
const starCtx = starCanvas.getContext("2d");

function drawStarText() {

    const w = starCanvas.clientWidth;
    const h = starCanvas.clientHeight;
    const dpr = window.devicePixelRatio || 1;

    starCanvas.width = w * dpr;
    starCanvas.height = h * dpr;

    starCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    starCtx.clearRect(0, 0, w, h);

    const off = document.createElement("canvas");
    off.width = w;
    off.height = h;

    const ctx = off.getContext("2d");

    // Two lines of star lettering
    const line1 = "HAPPY BIRTHDAY.....";
    const line2 = "SU!!!";

    const fontSize = Math.min(w / 19, 37);

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = `bold ${fontSize}px Arial`;

    // First line
    ctx.fillStyle = "white";
    ctx.fillText(line1, w / 2, 32, w * 0.98);

    // Second line - larger and brighter
    ctx.font = `bold ${fontSize * 1.65}px Arial`;
    ctx.fillText(line2, w / 2, 95, w * 0.9);

    const pixels = ctx.getImageData(0, 0, w, h).data;

    const points = [];

    // Convert letters into individual stars
    for (let y = 0; y < h; y += 4) {
        for (let x = 0; x < w; x += 4) {

            const index = (y * w + x) * 4;

            if (pixels[index + 3] > 100) {
                points.push({ x, y });
            }
        }
    }

    // Draw each letter using glowing stars
    starCtx.textAlign = "center";

    points.forEach((p, i) => {

        const isSU = p.y > 60;

        const size = isSU ? 2.8 : 1.8;

        starCtx.beginPath();
        starCtx.arc(p.x, p.y, size, 0, Math.PI * 2);

        starCtx.fillStyle = isSU ? "#fff0a6" : "#ffffff";

        starCtx.shadowBlur = isSU ? 14 : 8;
        starCtx.shadowColor = isSU ? "#ffbd38" : "#9edbff";

        starCtx.globalAlpha = 0.7 + Math.random() * 0.3;
        starCtx.fill();

        // Additional sparkling points
        if (i % 12 === 0) {
            starCtx.font = "9px Arial";
            starCtx.fillStyle = "#fff6c7";
            starCtx.fillText("✦", p.x, p.y);
        }
    });

    starCtx.globalAlpha = 1;
    starCtx.shadowBlur = 0;
}

drawStarText();
window.addEventListener("resize", drawStarText);

// Star lettering twinkle
setInterval(drawStarText, 1800);

/* RISING SKY LANTERNS */
for (let i = 0; i < 24; i++) {

    const lantern = document.createElement("div");

    lantern.className = "lantern";
    lantern.style.left = Math.random() * 100 + "%";
    lantern.style.animationDuration =
        (12 + Math.random() * 12) + "s";
    lantern.style.animationDelay =
        (Math.random() * 20) + "s";

    document.body.appendChild(lantern);
}

/* SHOOTING STARS */
function createShootingStar() {

    const shooting = document.createElement("div");

    shooting.className = "shooting-star";
    shooting.style.left = (40 + Math.random() * 60) + "%";
    shooting.style.top = (Math.random() * 45) + "%";

    sky.appendChild(shooting);

    setTimeout(() => shooting.remove(), 3000);
}

setInterval(createShootingStar, 2500);

/* FIREWORKS */
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

resizeCanvas();
window.addEventListener("resize", resizeCanvas);

let particles = [];

function explode(x, y) {

    const colors = [
        "#ff3b3b", "#ffd700", "#00e5ff",
        "#ff69b4", "#7cff6b", "#ffffff",
        "#b388ff", "#ff9f43"
    ];

    const color = colors[
        Math.floor(Math.random() * colors.length)
    ];

    for (let i = 0; i < 90; i++) {

        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5 + 1;

        particles.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 100,
            color: color,
            size: Math.random() * 3 + 1
        });
    }
}

function animateFireworks() {

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    particles.forEach((p, index) => {

        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.025;
        p.vx *= 0.99;
        p.vy *= 0.99;
        p.life--;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);

        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.life / 100);
        ctx.shadowBlur = 12;
        ctx.shadowColor = p.color;

        ctx.fill();

        if (p.life <= 0) {
            particles.splice(index, 1);
        }
    });

    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;

    requestAnimationFrame(animateFireworks);
}

animateFireworks();

/* AUTOMATIC FIREWORKS */
setInterval(() => {

    explode(
        Math.random() * canvas.width,
        Math.random() * canvas.height * 0.55
    );

}, 1200);

/* CELEBRATION BUTTON */
function celebrate() {

    for (let i = 0; i < 10; i++) {

        setTimeout(() => {

            explode(
                Math.random() * canvas.width,
                Math.random() * canvas.height * 0.65
            );

        }, i * 200);
    }
}

/* INITIAL CELEBRATION */
setTimeout(celebrate, 1000);

</script>

</body>
</html>
