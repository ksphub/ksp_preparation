
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday SU</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

body {
    background: linear-gradient(to bottom, #020617, #101b3b, #263b62);
    color: white;
}

.sky {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
}

/* Background stars */
.star {
    position: absolute;
    color: white;
    text-shadow: 0 0 8px white;
    animation: twinkle 2s infinite alternate;
}

@keyframes twinkle {
    from { opacity: 0.2; transform: scale(0.7); }
    to { opacity: 1; transform: scale(1.5); }
}

/* Star lettering */
.star-message {
    position: absolute;
    top: 3%;
    left: 50%;
    transform: translateX(-50%);
    width: 99%;
    max-width: 1000px;
    height: 270px;
}

#starText {
    width: 100%;
    height: 100%;
    display: block;
}

/* Crescent moon */
.moon-container {
    position: absolute;
    top: 13%;
    left: 50%;
    transform: translateX(-50%);
    width: 100px;
    height: 90px;
    animation: moonFloat 4s ease-in-out infinite;
    z-index: 2;
}

.moon {
    position: absolute;
    width: 58px;
    height: 58px;
    top: 10px;
    left: 17px;
    border-radius: 50%;
    background: linear-gradient(135deg, #fffde7, #ffe58a, #ffbd45);
    overflow: hidden;
    box-shadow:
        0 0 12px #fff5bd,
        0 0 25px #ffdf70,
        0 0 45px rgba(255,196,72,0.5);
}

.moon::after {
    content: "";
    position: absolute;
    width: 58px;
    height: 58px;
    top: -12px;
    left: 21px;
    border-radius: 50%;
    background: #101b3b;
}

.moon-shine {
    position: absolute;
    top: 8px;
    left: 27px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: white;
    box-shadow: 0 0 12px 5px #fff5bd;
    z-index: 2;
}

.moon-star {
    position: absolute;
    color: #fff3a6;
    font-size: 17px;
    text-shadow: 0 0 12px gold, 0 0 20px white;
    animation: twinkle 1.5s infinite alternate;
}

.moon-star.one { top: 0; right: 0; }
.moon-star.two { bottom: 0; left: 0; font-size: 12px; }
.moon-star.three { top: 43px; right: -5px; font-size: 11px; }

@keyframes moonFloat {
    0%, 100% { transform: translate(-50%, 0); }
    50% { transform: translate(-50%, -8px); }
}

/* Shooting stars */
.shooting-star {
    position: absolute;
    width: 90px;
    height: 2px;
    background: linear-gradient(90deg, white, transparent);
    animation: shooting 3s linear forwards;
}

@keyframes shooting {
    from {
        transform: translate(0,0) rotate(-35deg);
        opacity: 1;
    }
    to {
        transform: translate(-400px,300px) rotate(-35deg);
        opacity: 0;
    }
}

/* Fireworks */
#fireworks {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

/* Lanterns */
.lantern {
    position: fixed;
    bottom: -50px;
    width: 17px;
    height: 25px;
    background: linear-gradient(to bottom,#fff5b5,#ff9b42);
    border-radius: 45% 45% 35% 35%;
    box-shadow: 0 0 12px #ffc45e, 0 0 25px #ff9b42;
    animation: lanternRise linear infinite;
    pointer-events: none;
}

.lantern::after {
    content: "";
    position: absolute;
    bottom: -3px;
    left: 5px;
    width: 7px;
    height: 4px;
    background: #ffe5a0;
}

@keyframes lanternRise {
    0% { transform: translateY(0); opacity: 0; }
    15% { opacity: 1; }
    50% { transform: translateY(-50vh) translateX(25px); }
    100% {
        transform: translateY(-115vh) translateX(-25px);
        opacity: 0;
    }
}

/* Birthday wishes */
.content {
    position: absolute;
    top: 60%;
    left: 50%;
    transform: translate(-50%,-50%);
    width: 90%;
    max-width: 850px;
    text-align: center;
    z-index: 5;
}

.content p {
    margin-top: 15px;
    font-size: clamp(15px,2.5vw,21px);
    line-height: 1.7;
    color: #fff4df;
    text-shadow: 0 0 8px #a9baff;
}

button {
    margin-top: 22px;
    padding: 12px 25px;
    border: none;
    border-radius: 30px;
    background: linear-gradient(45deg,#ffcc70,#ff758c);
    color: #171126;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 15px #ffb347;
}

/* Mobile layout */
@media(max-width:500px) {
    .star-message {
        top: 4%;
        height: 230px;
        width: 99%;
    }

    .moon-container {
        top: 12%;
        transform: translateX(-50%) scale(0.78);
    }

    .content {
        top: 61%;
    }

    .content p {
        font-size: 15px;
    }
}

@media(max-height:650px) {
    .star-message {
        top: 1%;
        height: 220px;
    }

    .moon-container {
        top: 11%;
        transform: translateX(-50%) scale(0.7);
    }

    .content {
        top: 64%;
    }
}
</style>
</head>

<body>

<div class="sky" id="sky">

    <div class="star-message">
        <canvas id="starText"></canvas>
    </div>

    <!-- Stylish crescent moon -->
    <div class="moon-container">
        <div class="moon">
            <div class="moon-shine"></div>
        </div>
        <span class="moon-star one">✦</span>
        <span class="moon-star two">✧</span>
        <span class="moon-star three">✦</span>
    </div>

</div>

<canvas id="fireworks"></canvas>

<!-- Birthday wishes: old heading removed -->
<div class="content">

    <p>
        May your life shine as brightly as the stars
        and sparkle like the beautiful moon.
        <br>
        May every dream come true and every moment
        bring happiness, love and success.
        <br><br>
        ❤️ Wishing you a wonderful birthday! ❤️
    </p>

    <button onclick="celebrate()">
        🎆 Celebrate Birthday 🎆
    </button>

</div>

<script>

/* BACKGROUND STARS */
const sky = document.getElementById("sky");

for (let i = 0; i < 150; i++) {
    const s = document.createElement("span");
    s.className = "star";
    s.textContent = Math.random() > 0.5 ? "✦" : "·";
    s.style.left = Math.random()*100+"%";
    s.style.top = Math.random()*100+"%";
    s.style.fontSize = (3+Math.random()*7)+"px";
    s.style.animationDelay = Math.random()*3+"s";
    sky.appendChild(s);
}

/* STAR LETTERING */
const starCanvas = document.getElementById("starText");
const starCtx = starCanvas.getContext("2d");

let letterStars = [];
let sparkleStars = [];

function buildStarLetters() {

    const w = starCanvas.clientWidth;
    const h = starCanvas.clientHeight;
    const dpr = window.devicePixelRatio || 1;

    if (!w || !h) return;

    starCanvas.width = w*dpr;
    starCanvas.height = h*dpr;

    starCtx.setTransform(dpr,0,0,dpr,0,0);

    const off = document.createElement("canvas");
    off.width = Math.ceil(w);
    off.height = Math.ceil(h);

    const ctx = off.getContext("2d");

    /* FIRST LINE: HAPPY BIRTHDAY..... */
    const line1 = "HAPPY BIRTHDAY.....";
    const size1 = Math.min(w/17, 43);

    ctx.font = `bold ${size1}px Georgia`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "white";

    ctx.fillText(line1,w/2,43,w*0.98);

    /* SECOND LINE: SU!!! */
    const line2 = "SU!!!";
    const size2 = Math.min(w/6, 76);

    ctx.font = `bold ${size2}px Georgia`;
    ctx.fillText(line2,w/2,235,w*0.85);

    const pixels = ctx.getImageData(0,0,off.width,off.height).data;

    letterStars = [];

    /* Stars following the actual letter shapes */
    for (let y=0; y<h; y+=3) {
        for (let x=0; x<w; x+=3) {

            const index = (Math.floor(y)*off.width+Math.floor(x))*4;

            if (pixels[index+3] > 100 && Math.random() > 0.12) {

                const isSU = y > 110;

                letterStars.push({
                    x: x+(Math.random()-0.5)*2,
                    y: y+(Math.random()-0.5)*2,
                    size: isSU
                        ? 1.8+Math.random()*2.3
                        : 0.8+Math.random()*1.6,
                    gold: isSU || Math.random()>0.72,
                    phase: Math.random()*Math.PI*2,
                    speed: 0.8+Math.random()*2
                });
            }
        }
    }

    /* Independent decorative stars */
    sparkleStars = [];

    for (let i=0; i<65; i++) {
        sparkleStars.push({
            x: Math.random()*w,
            y: Math.random()*h,
            size: 0.8+Math.random()*2,
            phase: Math.random()*Math.PI*2,
            speed: 0.8+Math.random()*2
        });
    }
}

/* ANIMATE THE STARS */
let animationFrame = 0;

function drawStarLetters() {

    const w = starCanvas.clientWidth;
    const h = starCanvas.clientHeight;

    starCtx.clearRect(0,0,w,h);

    animationFrame += 0.025;

    letterStars.forEach(s => {

        const glow = 0.45+
            0.55*(0.5+0.5*Math.sin(animationFrame*s.speed+s.phase));

        starCtx.globalAlpha = glow;

        starCtx.beginPath();
        starCtx.arc(s.x,s.y,s.size,0,Math.PI*2);

        starCtx.fillStyle = s.gold ? "#ffd978" : "#ffffff";
        starCtx.shadowBlur = s.gold ? 12 : 8;
        starCtx.shadowColor = s.gold ? "#ffbd38" : "#b9eaff";
        starCtx.fill();

        if (glow > 0.93 && s.size > 2) {
            starCtx.font = "10px Arial";
            starCtx.fillStyle = "#fff9d6";
            starCtx.fillText("✦",s.x,s.y);
        }
    });

    sparkleStars.forEach(s => {

        const glow = 0.2+
            0.8*(0.5+0.5*Math.sin(animationFrame*s.speed+s.phase));

        starCtx.globalAlpha = glow;

        starCtx.beginPath();
        starCtx.arc(s.x,s.y,s.size,0,Math.PI*2);

        starCtx.fillStyle = "#fff4c1";
        starCtx.shadowBlur = 12;
        starCtx.shadowColor = "#ffd76a";
        starCtx.fill();
    });

    starCtx.globalAlpha = 1;
    starCtx.shadowBlur = 0;

    requestAnimationFrame(drawStarLetters);
}

buildStarLetters();
drawStarLetters();

window.addEventListener("resize",buildStarLetters);

/* RISING LANTERNS */
for(let i=0;i<24;i++) {

    const lantern=document.createElement("div");

    lantern.className="lantern";
    lantern.style.left=Math.random()*100+"%";
    lantern.style.animationDuration=(12+Math.random()*12)+"s";
    lantern.style.animationDelay=Math.random()*20+"s";

    document.body.appendChild(lantern);
}

/* SHOOTING STARS */
function createShootingStar() {

    const s=document.createElement("div");

    s.className="shooting-star";
    s.style.left=(40+Math.random()*60)+"%";
    s.style.top=Math.random()*45+"%";

    sky.appendChild(s);

    setTimeout(()=>s.remove(),3000);
}

setInterval(createShootingStar,2500);

/* FIREWORKS */
const canvas=document.getElementById("fireworks");
const ctx=canvas.getContext("2d");

function resizeCanvas() {
    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;
}

resizeCanvas();
window.addEventListener("resize",resizeCanvas);

let particles=[];

function explode(x,y) {

    const colors=[
        "#ff3b3b","#ffd700","#00e5ff",
        "#ff69b4","#7cff6b","#ffffff",
        "#b388ff","#ff9f43"
    ];

    const color=colors[Math.floor(Math.random()*colors.length)];

    for(let i=0;i<90;i++) {

        const angle=Math.random()*Math.PI*2;
        const speed=Math.random()*5+1;

        particles.push({
            x,y,
            vx:Math.cos(angle)*speed,
            vy:Math.sin(angle)*speed,
            life:100,
            color,
            size:Math.random()*3+1
        });
    }
}

function animateFireworks() {

    ctx.clearRect(0,0,canvas.width,canvas.height);

    particles.forEach((p,index)=>{

        p.x+=p.vx;
        p.y+=p.vy;
        p.vy+=0.025;
        p.vx*=0.99;
        p.vy*=0.99;
        p.life--;

        ctx.beginPath();
        ctx.arc(p.x,p.y,p.size,0,Math.PI*2);

        ctx.fillStyle=p.color;
        ctx.globalAlpha=Math.max(0,p.life/100);
        ctx.shadowBlur=12;
        ctx.shadowColor=p.color;
        ctx.fill();

        if(p.life<=0) {
            particles.splice(index,1);
        }
    });

    ctx.globalAlpha=1;
    ctx.shadowBlur=0;

    requestAnimationFrame(animateFireworks);
}

animateFireworks();

/* AUTOMATIC FIREWORKS */
setInterval(()=>{
    explode(
        Math.random()*canvas.width,
        Math.random()*canvas.height*0.55
    );
},1200);

/* CELEBRATE BUTTON */
function celebrate() {

    for(let i=0;i<10;i++) {

        setTimeout(()=>{
            explode(
                Math.random()*canvas.width,
                Math.random()*canvas.height*0.65
            );
        },i*200);
    }
}

setTimeout(celebrate,1000);

</script>

</body>
</html>
